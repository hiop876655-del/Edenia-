name: idenia_hisba
description: "برنامج حسابات ومخزن تجاري احترافي أوفلاين لويندوز وأندرويد مبني بـ Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Local SQLite Database (Mobile & Windows Desktop)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+4
  path_provider: ^2.1.2
  path: ^1.9.0

  # Fonts & UI Design (Material 3 & Cairo Arabic font)
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # Hardware Security & License Fingerprint
  device_info_plus: ^10.1.0
  crypto: ^3.0.3

  # Preferences & Cache
  shared_preferences: ^2.2.2

  # Barcode & Thermal Receipt Printing
  barcode_widget: ^2.0.4
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  http: ^1.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
