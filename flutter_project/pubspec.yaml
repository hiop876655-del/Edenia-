name: idenia_hisba
description: "إيدينيا - حِسبة | تطبيق محاسبي ونقاط بيع أوفلاين 100% للويندوز والأندرويد"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.0
  pdf: ^3.10.8
  printing: ^5.13.1
  uuid: ^4.4.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
